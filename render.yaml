# Render Blueprint for the Acc App backend (Express API).
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: In Render, choose "New +" -> "Blueprint", connect this repo, and
# Render will read this file. Values marked `sync: false` are NOT stored in
# git -- Render prompts you for them (or you set them in the dashboard).
#
# !! IMPORTANT -- READ THIS BEFORE CREATING THE SERVICE !!
# This file is only honored by a BLUEPRINT-managed service. If you instead
# create a plain "Web Service", Render ignores every setting below: no
# NODE_VERSION, no rootDir, and above all NO PROMPT for the `sync: false`
# values, which leaves MONGO_URI unset and the service exits 1 on boot with
# "Failed to start server: MONGO_URI is not set".
# Tell-tale sign you are on a manual service: a `sync: false` var was never
# asked for, and the build log says "Using Node.js version <X> (default)"
# instead of the pinned 20.
#
# MINIMUM VIABLE ENV SET -- all REQUIRED or the process exits 1:
#   MONGO_URI           Atlas connection string      (sync: false -> set it)
#   JWT_ACCESS_SECRET   long random string           (sync: false -> set it)
#   JWT_REFRESH_SECRET  a DIFFERENT random string    (sync: false -> set it)
#   CLIENT_URL          exact frontend origin, no trailing slash
# CLIENT_URL is required because Render is detected as a deployed environment
# (see server/src/config/env.js). Leaving it unset boots an API whose /health is
# green but whose CORS rejects every browser request -- the browser then sends no
# POST at all and the UI reports "Can't reach the API ... got no reply". Failing
# the deploy instead makes that a 1-minute fix.
# Everything else below has a safe default or disables itself when unset.
#
# The frontend is hosted separately on Vercel. The database is MongoDB Atlas;
# it is not declared here, so create the cluster first and paste MONGO_URI
# into the dashboard. See docs/DEPLOYMENT.md for the full runbook.

services:
  - type: web
    name: acc-app-api
    runtime: node
    plan: free
    region: singapore # pick the region closest to you; must be reachable by your Vercel users
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Secrets / environment-specific values -- set these in the Render
      # dashboard. The first FOUR are REQUIRED: if any is missing the server
      # refuses to start and the deploy fails (see server/src/config/env.js).
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Exact frontend origin for CORS -- REQUIRED in this environment, no
      # trailing slash (e.g. https://dukan-sigma.vercel.app).
      # Vercel hands out a different hostname per deployment, so list every one
      # you use, comma-separated (e.g. "https://dukan-sigma.vercel.app,https://
      # dukan-app-nine.vercel.app") -- or assign a stable production domain.
      # Render injects PORT automatically; the app reads process.env.PORT.
      - key: CLIENT_URL
        sync: false
      - key: SHARE_LINK_BASE_URL
        sync: false
      - key: SHARE_LINK_TTL_DAYS
        value: "30"
      # SMTP is optional -- only needed for emailing invoices.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
